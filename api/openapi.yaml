      properties:
        total: { type: integer, minimum: 0 }
        active: { type: integer, minimum: 0 }
        failed: { type: integer, minimum: 0 }
        inactive: { type: integer, minimum: 0 }
        items: { type: array, items: { $ref: "#/components/schemas/Service" } }
    Service:
      type: object
      additionalProperties: false
      required: [name, description, load_state, active_state, sub_state]
      properties:
        name: { type: string, examples: [ssh.service] }
        description: { type: string }
        load_state: { type: string, examples: [loaded, not-found, masked] }
        active_state: { type: string, examples: [active, inactive, failed, activating] }
        sub_state: { type: string, examples: [running, exited, dead] }
    HistoryResponse:
      type: object
      additionalProperties: false
      required: [schema_version, machine_id, generated_at, status, from, to, resolution, step_seconds, series]
      properties:
        schema_version: { $ref: "#/components/schemas/SchemaVersion" }
        machine_id: { $ref: "#/components/schemas/MachineID" }
        generated_at: { $ref: "#/components/schemas/Timestamp" }
        status: { $ref: "#/components/schemas/Availability" }
        reason: { type: string }
        from: { $ref: "#/components/schemas/Timestamp" }
        to: { $ref: "#/components/schemas/Timestamp" }
        resolution: { type: string, enum: [raw, 1m, 1h] }
        step_seconds: { type: integer, minimum: 1 }
        series:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [name, unit, points]
            properties:
              name: { type: string }
              unit: { type: string, enum: ["", percent, bytes, bytes_per_second, celsius, watts] }
              points:
                type: array
                items:
                  type: object
                  additionalProperties: false
                  required: [t, min, avg, max]
                  properties:
                    t: { $ref: "#/components/schemas/Timestamp" }
                    min: { type: number }
                    avg: { type: number }
                    max: { type: number }
    HistorySeriesList:
      type: object
      additionalProperties: false
      required: [schema_version, machine_id, generated_at, status, items]
      properties:
        schema_version: { $ref: "#/components/schemas/SchemaVersion" }
        machine_id: { $ref: "#/components/schemas/MachineID" }
        generated_at: { $ref: "#/components/schemas/Timestamp" }
        status: { $ref: "#/components/schemas/Availability" }
        reason: { type: string }
        items:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [name, unit, first, last]
            properties:
              name: { type: string, examples: [cpu.usage_percent, net.eth0.rx_bytes_per_second] }
              unit: { type: string }
              first: { $ref: "#/components/schemas/Timestamp" }
              last: { $ref: "#/components/schemas/Timestamp" }
    HealthSettings:
      type: object
      additionalProperties: false
      required: [confirm, cpu_temperature_celsius, memory_available_percent, memory_pressure_percent, storage_used_percent, network_errors_per_minute, disk]
      properties:
        confirm: { type: integer, minimum: 1, maximum: 20, description: Consecutive evaluations before a finding is raised or cleared. }
        cpu_temperature_celsius: { type: object, additionalProperties: false, required: [warn, critical], properties: { warn: { type: number }, critical: { type: number } } }
        memory_available_percent:
          description: Warning when available memory falls below warn; critical below critical.
          type: object
          additionalProperties: false
          required: [warn, critical]
          properties: { warn: { type: number }, critical: { type: number } }
        memory_pressure_percent: { type: object, additionalProperties: false, required: [warn, critical], properties: { warn: { type: number }, critical: { type: number } } }
        storage_used_percent: { type: object, additionalProperties: false, required: [warn, critical], properties: { warn: { type: number }, critical: { type: number } } }
        network_errors_per_minute: { type: object, additionalProperties: false, required: [warn, critical], properties: { warn: { type: number }, critical: { type: number } } }
        disk:
          type: object
          additionalProperties: false
          required: [warn_percentage_used]
          properties: { warn_percentage_used: { type: integer, minimum: 1, maximum: 100 } }
    Report:
      type: object
      additionalProperties: false
      description: GET /report (D21). Each part is the matching endpoint's response.
      required: [schema_version, machine_id, generated_at, anonymized, status, omitted]
      properties:
        schema_version: { $ref: "#/components/schemas/SchemaVersion" }
        machine_id: { $ref: "#/components/schemas/MachineID" }
        generated_at: { $ref: "#/components/schemas/Timestamp" }
        anonymized: { type: boolean }
        status: { $ref: "#/components/schemas/Status" }
        system: { $ref: "#/components/schemas/SystemResponse" }
        hardware: { $ref: "#/components/schemas/HardwareResponse" }
        services: { $ref: "#/components/schemas/ServicesResponse" }
        metrics: { $ref: "#/components/schemas/MetricsResponse" }
        storage: { $ref: "#/components/schemas/StorageResponse" }
        network: { $ref: "#/components/schemas/NetworkResponse" }
        health: { $ref: "#/components/schemas/HealthResponse" }
        events: { $ref: "#/components/schemas/EventsResponse" }
        settings: { $ref: "#/components/schemas/SettingsResponse" }
        omitted:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [section, reason]
            properties:
              section: { type: string, enum: [metrics, storage, network, health, events, settings] }
              reason: { type: string }
    ContainersResponse:
      type: object
      additionalProperties: false
      description: GET /containers.
      required: [schema_version, machine_id, generated_at, containers]
      properties:
        schema_version: { $ref: "#/components/schemas/SchemaVersion" }
        machine_id: { $ref: "#/components/schemas/MachineID" }
        generated_at: { $ref: "#/components/schemas/Timestamp" }
        containers:
          type: object
          additionalProperties: false
          description: Data with its availability (see docs/API.md §5).
          required: [status, collected_at, stale, source, data]
          properties:
            status: { $ref: "#/components/schemas/Availability" }
            collected_at: { type: [string, "null"], format: date-time }
            stale: { type: boolean }
            source: { type: string }
            reason: { type: string }
            data:
              anyOf:
                - { $ref: "#/components/schemas/ContainerList" }
                - type: "null"
    ContainerList:
      type: object
      additionalProperties: false
      required: [total, items, names_reason]
      properties:
        total: { type: integer, minimum: 0 }
        items:
          type: array
          maxItems: 500
          items: { $ref: "#/components/schemas/Container" }
        names_reason: { type: string }
    Container:
      type: object
      additionalProperties: false
      required: [runtime, id, rootless, uid, cpu_percent, memory_bytes, memory_limit_bytes, io_read_bytes_per_second, io_write_bytes_per_second, pids]
      properties:
        runtime: { type: string, enum: [docker, podman, containerd, cri-o] }
        id: { type: string, pattern: "^[0-9a-f]{64}$" }
        rootless: { type: boolean }
        uid: { type: [integer, "null"], description: Owner of a rootless container. }
        cpu_percent: { type: [number, "null"], description: "Percent of one core; null on the first sample." }
        memory_bytes: { type: [integer, "null"] }
        memory_limit_bytes: { type: [integer, "null"], description: Null when unlimited or unknown. }
        io_read_bytes_per_second: { type: [number, "null"] }
        io_write_bytes_per_second: { type: [number, "null"] }
        pids: { type: [integer, "null"] }
    SettingsResponse:
      type: object
      additionalProperties: false
      required: [health, source, updated_at]
      properties:
        health: { $ref: "#/components/schemas/HealthSettings" }
        source: { type: string, enum: [configuration, override] }
        updated_at: { type: [string, "null"], format: date-time }
    UpdateSettingsRequest:
      type: object
      additionalProperties: false
      required: [health]
      properties:
        health: { $ref: "#/components/schemas/HealthSettings" }
    Scope:
      type: string
      enum: [system:read, metrics:read, processes:read, admin]
    APIKey:
      type: object
      additionalProperties: false
      description: Key metadata. Never contains the key or its hash.
      required: [id, name, display, scopes, active, created_at, expires_at, last_used_at, revoked_at, rotated_from]
      properties:
        id: { type: string, pattern: "^[a-z2-7]{12}$" }
        name: { type: string }
        display: { type: string, description: "Masked form, e.g. ckp_k3p9x2m7q4ta_…" }
        scopes: { type: array, items: { $ref: "#/components/schemas/Scope" } }
        active: { type: boolean }
        created_at: { $ref: "#/components/schemas/Timestamp" }
        expires_at: { type: [string, "null"], format: date-time }
        last_used_at:
          type: [string, "null"]
          format: date-time
          description: May lag by up to about 30 seconds.
        revoked_at: { type: [string, "null"], format: date-time }
        rotated_from: { type: [string, "null"] }
    APIKeyList:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/APIKey" } }
    CreateAPIKeyRequest:
      type: object
      additionalProperties: false
      required: [name, scopes]
      properties:
        name: { type: string, minLength: 1, maxLength: 64 }
        scopes:
          type: array
          minItems: 1
          description: Keys may hold system:read, metrics:read and processes:read; never admin.
          items: { type: string, enum: [system:read, metrics:read, processes:read] }
        expires_at: { type: string, format: date-time }
    CreatedAPIKey:
      type: object
      additionalProperties: false
      required: [key, api_key]
      properties:
        key:
          type: string
          pattern: "^ckp_[a-z2-7]{12}_[0-9A-Za-z]{43}$"
          description: The full key. Shown exactly once.
        api_key: { $ref: "#/components/schemas/APIKey" }
    APIKeyResponse:
      type: object
      additionalProperties: false
      required: [api_key]
      properties:
        api_key: { $ref: "#/components/schemas/APIKey" }
    ErrorEnvelope:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error:
          type: object
          additionalProperties: false
          required: [code, message, request_id]
          properties:
            code:
              type: string
              enum:
                - invalid_request
                - invalid_parameter
                - invalid_cursor
                - invalid_host
                - authentication_required
                - invalid_credentials
                - insufficient_scope
                - not_found
                - method_not_allowed
                - request_too_large
                - rate_limited
                - internal_error
            message: { type: string }
            request_id: { type: string }
