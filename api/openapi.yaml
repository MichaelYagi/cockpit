      required: [status, collected_at, stale, source, data]
      properties:
        status: { $ref: "#/components/schemas/Availability" }
        collected_at: { type: [string, "null"], format: date-time }
        stale: { type: boolean, description: True when the data is older than twice the collection interval. }
        source: { type: string, description: "Where the data comes from, e.g. procfs." }
        reason: { type: string, description: Safe explanation when status is not available. }
        data:
          anyOf:
            - type: array
              items: { $ref: "#/components/schemas/BlockDevice" }
            - type: "null"
    NetworkInterfaceInventorySection:
      type: object
