            - type: "null"
    Route:
      type: object
      additionalProperties: false
      required: [family, destination, gateway, interface, metric, default]
      properties:
        family: { type: string, enum: [ipv4, ipv6] }
        destination: { type: string, examples: ["0.0.0.0/0", "192.168.1.0/24"] }
        gateway: { type: string, description: Empty for directly connected routes. }
        interface: { type: string }
        metric: { type: integer, minimum: 0 }
        default: { type: boolean }
    DNS:
      type: object
      additionalProperties: false
      required: [nameservers, search, resolver]
      properties:
        nameservers: { type: array, items: { type: string } }
        search: { type: array, items: { type: string } }
        resolver: { type: string, enum: [resolv.conf, systemd-resolved], description: "With systemd-resolved, nameservers are its upstream servers." }
    Sensor:
      type: object
      additionalProperties: false
      required: [kind, chip, label, value, unit, high, critical, source, cpu]
      properties:
        kind: { type: string, enum: [temperature, fan, voltage] }
        chip: { type: string, examples: [coretemp] }
        label: { type: string }
        value: { type: number }
        unit: { type: string, enum: [celsius, rpm, volts] }
        high: { type: [number, "null"], description: Hardware warning threshold. }
        critical: { type: [number, "null"], description: Hardware critical threshold. }
        source: { type: string, enum: [hwmon, thermal_zone] }
        cpu: { type: boolean, description: The sensor measures the CPU. }
    DiskHealth:
      type: object
      additionalProperties: false
      required: [device, protocol, smart_passed, temperature_celsius, power_on_hours, percentage_used, critical_warning, reallocated_sectors, pending_sectors, media_errors]
      properties:
        device: { type: string }
        protocol: { type: string, examples: [NVMe, ATA] }
        smart_passed: { type: [boolean, "null"] }
        temperature_celsius: { type: [number, "null"] }
        power_on_hours: { type: [integer, "null"], minimum: 0 }
        percentage_used: { type: [integer, "null"], minimum: 0, description: NVMe rated endurance used. }
        critical_warning: { type: [integer, "null"], minimum: 0 }
        reallocated_sectors: { type: [integer, "null"], minimum: 0 }
        pending_sectors: { type: [integer, "null"], minimum: 0 }
        media_errors: { type: [integer, "null"], minimum: 0 }
    StorageResponse:
      type: object
