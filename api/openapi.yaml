      properties:
        schema_version: { $ref: "#/components/schemas/SchemaVersion" }
        machine_id: { $ref: "#/components/schemas/MachineID" }
        generated_at: { $ref: "#/components/schemas/Timestamp" }
        interfaces: { $ref: "#/components/schemas/NetworkInterfacesSection" }
        routes: { $ref: "#/components/schemas/RoutesSection" }
        dns: { $ref: "#/components/schemas/DNSSection" }
    SensorsResponse:
      type: object
      additionalProperties: false
      description: GET /sensors.
      required: [schema_version, machine_id, generated_at, sensors]
      properties:
        schema_version: { $ref: "#/components/schemas/SchemaVersion" }
        machine_id: { $ref: "#/components/schemas/MachineID" }
        generated_at: { $ref: "#/components/schemas/Timestamp" }
        sensors: { $ref: "#/components/schemas/SensorsSection" }
    HealthResponse:
      type: object
      additionalProperties: false
      description: GET /health. Overall status is the worst known check; unknown when no check could run.
      required: [schema_version, machine_id, generated_at, status, evaluated_at, checks]
      properties:
        schema_version: { $ref: "#/components/schemas/SchemaVersion" }
        machine_id: { $ref: "#/components/schemas/MachineID" }
        generated_at: { $ref: "#/components/schemas/Timestamp" }
        status: { $ref: "#/components/schemas/HealthStatus" }
        evaluated_at: { $ref: "#/components/schemas/Timestamp" }
        checks: { type: array, items: { $ref: "#/components/schemas/HealthCheck" } }
    HealthStatus:
      type: string
      enum: [ok, warning, critical, unknown]
    HealthCheck:
      type: object
      additionalProperties: false
      required: [id, name, status, availability, findings]
      properties:
        id: { type: string, enum: [cpu_temperature, memory, storage_capacity, disk_health, services, network_errors, zfs_pools, ups] }
        name: { type: string }
        status: { $ref: "#/components/schemas/HealthStatus" }
        availability:
          description: Availability of the data the check needs. When not available, status is unknown and reason explains why.
          $ref: "#/components/schemas/Availability"
        reason: { type: string }
        summary: { type: string }
        findings:
          type: array
          items: { $ref: "#/components/schemas/Finding" }
    Finding:
      type: object
      additionalProperties: false
      required: [id, check, severity, subject, summary, evidence, recommendation, since]
      properties:
        id: { type: string, pattern: "^fnd_[0-9a-f]{16}$" }
        check: { type: string }
        severity: { type: string, enum: [warning, critical] }
        subject: { type: string, examples: ["filesystem:/home"] }
        summary: { type: string }
        evidence:
          type: object
          additionalProperties: { type: string }
        recommendation: { type: string }
        since: { $ref: "#/components/schemas/Timestamp" }
    EventsResponse:
      type: object
      additionalProperties: false
      description: GET /events.
      required: [schema_version, machine_id, generated_at, items, next_cursor]
      properties:
        schema_version: { $ref: "#/components/schemas/SchemaVersion" }
        machine_id: { $ref: "#/components/schemas/MachineID" }
        generated_at: { $ref: "#/components/schemas/Timestamp" }
        items: { type: array, items: { $ref: "#/components/schemas/Event" } }
        next_cursor: { type: [string, "null"], description: Pass as cursor to get older events; null when there are no more. }
    Event:
      type: object
      additionalProperties: false
      required: [id, time, type, severity, subject, message]
      properties:
        id: { type: string, pattern: "^evt_[0-9A-HJKMNP-TV-Z]{26}$" }
        time: { $ref: "#/components/schemas/Timestamp" }
        type:
          type: string
          enum: [finding.raised, finding.resolved, collector.degraded, collector.recovered, key.created, key.rotated, key.revoked, settings.changed]
        severity: { type: string, enum: [info, warning, critical] }
        subject: { type: string }
        message: { type: string }
    ProcessesResponse:
      type: object
      additionalProperties: false
      required: [schema_version, machine_id, generated_at, status, collected_at, window_seconds, partial, total, items, next_cursor, redacted]
      properties:
        schema_version: { $ref: "#/components/schemas/SchemaVersion" }
        machine_id: { $ref: "#/components/schemas/MachineID" }
        generated_at: { $ref: "#/components/schemas/Timestamp" }
        status: { $ref: "#/components/schemas/Availability" }
        reason: { type: string }
        collected_at: { type: [string, "null"], format: date-time }
        window_seconds: { type: number, minimum: 0 }
        partial:
          type: boolean
          description: True when the kernel hides other users' processes (/proc hidepid).
        total: { type: integer, minimum: 0, description: Matching processes across all pages. }
        items: { type: array, items: { $ref: "#/components/schemas/Process" } }
        next_cursor: { type: [string, "null"] }
        redacted: { $ref: "#/components/schemas/Redacted" }
    Process:
      type: object
      additionalProperties: false
      required: [pid, ppid, name, user, uid, state, threads, cpu_percent, memory_percent, rss_bytes, virtual_bytes, started_at, kernel_thread]
      properties:
        pid: { type: integer, minimum: 1 }
        ppid: { type: integer, minimum: 0 }
        name: { type: string, description: Kernel command name (at most 15 characters). }
        user: { type: string }
        uid: { type: integer, minimum: -1 }
        state: { type: string, examples: [R, S, D, Z, T, I] }
        threads: { type: integer, minimum: 0 }
        cpu_percent: { type: [number, "null"], minimum: 0 }
        memory_percent: { type: number, minimum: 0, maximum: 100 }
        rss_bytes: { type: integer, minimum: 0 }
        virtual_bytes: { type: integer, minimum: 0 }
        started_at: { type: [string, "null"], format: date-time }
        kernel_thread: { type: boolean }
    ServicesResponse:
      type: object
      additionalProperties: false
      required: [schema_version, machine_id, generated_at, services]
      properties:
        schema_version: { $ref: "#/components/schemas/SchemaVersion" }
        machine_id: { $ref: "#/components/schemas/MachineID" }
        generated_at: { $ref: "#/components/schemas/Timestamp" }
        services: { $ref: "#/components/schemas/ServicesSection" }
    ServicesSection:
      type: object
      additionalProperties: false
      description: Data with its availability (see docs/API.md §5).
      required: [status, collected_at, stale, source, data]
      properties:
        status: { $ref: "#/components/schemas/Availability" }
        collected_at: { type: [string, "null"], format: date-time }
        stale: { type: boolean }
        source: { type: string }
        reason: { type: string }
        data:
          anyOf:
            - $ref: "#/components/schemas/ServiceList"
            - type: "null"
