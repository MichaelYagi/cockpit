openapi: 3.1.0
info:
  title: Cockpit API
  version: "1.0.0"
  summary: Read-only machine monitoring API served by the Cockpit agent.
  description: |
    This document is the authoritative contract for the Cockpit API (D6).

    Transports:
    - Unix socket: callers are the local administrator; no API key is used.
      Key management (`/api/v1/keys`) exists only on the socket.
    - TCP: every request except those marked public requires
      `Authorization: Bearer ckp_...`, including from localhost. TCP
      requests are rate limited.

    Every response carries an `X-Request-ID` header. Timestamps are UTC
    RFC 3339. Operations declare their required scope in `x-cockpit-scope`
    (`public` means no authentication). Fields marked
    `x-cockpit-sensitive` are omitted by default and listed in the
    containing object's `redacted` array (D9).
  license:
    name: TBD
servers:
  - url: http://127.0.0.1:7878
    description: Default loopback listener
security:
  - apiKey: []
tags:
  - name: meta
    description: Liveness, specification and agent status.
  - name: machine
    description: Machine identity, inventory and live metrics.
  - name: health
    description: Health checks, findings and events.
  - name: keys
    description: API key management (Unix socket only).
paths:
  /api/v1/livez:
    get:
      operationId: getLivez
      tags: [meta]
      summary: Liveness probe
      description: Reports that the agent is serving requests. Reveals nothing else.
      security: []
      x-cockpit-scope: public
      responses:
        "200":
          description: The agent is serving requests.
          headers:
            X-Request-ID: { $ref: "#/components/headers/RequestID" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Livez" }
              example: { status: ok }
        "400": { $ref: "#/components/responses/BadRequest" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "500": { $ref: "#/components/responses/InternalError" }
  /api/v1/openapi.json:
    get:
      operationId: getOpenAPI
      tags: [meta]
      summary: This specification as JSON
      security: []
      x-cockpit-scope: public
      responses:
        "200":
          description: The OpenAPI document.
          headers:
            X-Request-ID: { $ref: "#/components/headers/RequestID" }
          content:
            application/json:
              schema: { type: object }
        "400": { $ref: "#/components/responses/BadRequest" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "500": { $ref: "#/components/responses/InternalError" }
  /api/v1/status:
    get:
      operationId: getStatus
      tags: [meta]
      summary: Agent status and collector capabilities
      description: The `api` object (listeners, request counters, active clients) is included only for the admin principal (Unix socket).
      x-cockpit-scope: system:read
      responses:
        "200":
          description: OK
          headers:
            X-Request-ID: { $ref: "#/components/headers/RequestID" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Status" }
              example:
                schema_version: "1"
                machine_id: 3f0c6c1e-8f5b-4d4e-9a57-2b1d2a2f9b10
                generated_at: "2026-11-11T15:30:00Z"
                agent:
                  version: v0.1.0
                  api_version: v1
                  started_at: "2026-11-11T15:00:00Z"
                  uptime_seconds: 1800
                collectors:
                  - id: linux.sensors
                    version: 1.0.0
                    external: false
                    capabilities:
                      - name: sensors.thermal
                        status: unsupported
                        reason: No hardware temperature sensors are exposed.
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "500": { $ref: "#/components/responses/InternalError" }
  /api/v1/system:
    get:
      operationId: getSystem
      tags: [machine]
      summary: Operating system and host identity
      x-cockpit-scope: system:read
      responses:
        "200":
          description: OK
          headers:
            X-Request-ID: { $ref: "#/components/headers/RequestID" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SystemResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "500": { $ref: "#/components/responses/InternalError" }
  /api/v1/hardware:
    get:
      operationId: getHardware
      tags: [machine]
      summary: Hardware inventory
      x-cockpit-scope: system:read
      responses:
        "200":
          description: OK
          headers:
            X-Request-ID: { $ref: "#/components/headers/RequestID" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HardwareResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "500": { $ref: "#/components/responses/InternalError" }
  /api/v1/services:
    get:
      operationId: listServices
      tags: [machine]
      summary: systemd services
      description: Unit state from systemd over D-Bus, refreshed every 10 seconds. Counts cover all services even when `state` filters the items.
      x-cockpit-scope: system:read
      parameters:
        - name: state
          in: query
          required: false
          schema: { type: string, enum: [active, failed, inactive] }
      responses:
        "200":
          description: OK
          headers:
            X-Request-ID: { $ref: "#/components/headers/RequestID" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ServicesResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "500": { $ref: "#/components/responses/InternalError" }
  /api/v1/report:
    get:
      operationId: getReport
      tags: [meta]
      summary: Diagnostic report
      description: >-
        A point-in-time report made of the status, system, hardware and
        services responses, plus metrics, storage, network, health and the
        latest 100 events when the caller also holds `metrics:read`, and the
        health thresholds over the local socket (D21). Sections the caller
        cannot read are listed in `omitted`. Sensitive fields stay redacted
        (D9). With `anonymize=true`, host names, DNS search domains,
        non-loopback IP addresses, MAC-like strings, user names from
        `/home` paths and the machine ID are replaced with stable
        placeholders.
      x-cockpit-scope: system:read
      parameters:
        - name: format
          in: query
          required: false
          schema: { type: string, enum: [json, markdown], default: json }
        - name: anonymize
          in: query
          required: false
          schema: { type: string, enum: ["true", "false"], default: "false" }
      responses:
        "200":
          description: OK
          headers:
            X-Request-ID: { $ref: "#/components/headers/RequestID" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Report" }
            text/markdown:
              schema: { type: string }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "500": { $ref: "#/components/responses/InternalError" }
  /api/v1/metrics:
    get:
      operationId: getMetrics
      tags: [machine]
      summary: Current metrics
      description: Returns all sections unless `sections` selects a subset.
      x-cockpit-scope: metrics:read
      parameters:
        - name: sections
          in: query
          required: false
          description: Comma-separated list of sections to include.
          schema:
            type: string
            pattern: "^(cpu|memory|memory_pressure|filesystems|network|sensors|gpu|custom|power|ups)(,(cpu|memory|memory_pressure|filesystems|network|sensors|gpu|custom|power|ups))*$"
          example: cpu,memory
      responses:
        "200":
          description: OK
          headers:
            X-Request-ID: { $ref: "#/components/headers/RequestID" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MetricsResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "500": { $ref: "#/components/responses/InternalError" }
  /api/v1/metrics/history:
    get:
      operationId: getMetricHistory
      tags: [machine]
      summary: Stored metric history
      description: |
        Samples are recorded every 10 seconds and rolled up to 1-minute and
        1-hour min/avg/max buckets (D18). `resolution=auto` picks the finest
        resolution that keeps each series within 2000 points. When history
        is disabled, `status` is `not_configured` and series are empty.
      x-cockpit-scope: metrics:read
      parameters:
        - name: series
          in: query
          required: true
          description: Comma-separated series names (at most 10); see /metrics/history/series.
          schema: { type: string, maxLength: 2600 }
          example: cpu.usage_percent,memory.used_percent
        - name: from
          in: query
          required: false
          description: Start (RFC 3339). Default one hour before `to`. The range may be at most 90 days.
          schema: { type: string, format: date-time }
        - name: to
          in: query
          required: false
          description: End (RFC 3339). Default now.
          schema: { type: string, format: date-time }
        - name: resolution
          in: query
          required: false
          schema: { type: string, enum: [auto, raw, 1m, 1h], default: auto }
      responses:
        "200":
          description: OK
          headers:
            X-Request-ID: { $ref: "#/components/headers/RequestID" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HistoryResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "500": { $ref: "#/components/responses/InternalError" }
  /api/v1/metrics/history/series:
    get:
      operationId: listHistorySeries
      tags: [machine]
      summary: Recorded history series
      x-cockpit-scope: metrics:read
      responses:
        "200":
          description: OK
          headers:
            X-Request-ID: { $ref: "#/components/headers/RequestID" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HistorySeriesList" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "500": { $ref: "#/components/responses/InternalError" }
  /api/v1/storage:
    get:
      operationId: getStorage
      tags: [machine]
      summary: Disks, filesystems and disk health
      x-cockpit-scope: metrics:read
      responses:
        "200":
          description: OK
          headers:
            X-Request-ID: { $ref: "#/components/headers/RequestID" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StorageResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "500": { $ref: "#/components/responses/InternalError" }
  /api/v1/network:
    get:
      operationId: getNetwork
      tags: [machine]
      summary: Network interfaces, counters and rates
      x-cockpit-scope: metrics:read
      responses:
        "200":
          description: OK
          headers:
            X-Request-ID: { $ref: "#/components/headers/RequestID" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NetworkResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "500": { $ref: "#/components/responses/InternalError" }
  /api/v1/sensors:
    get:
      operationId: getSensors
      tags: [health]
      summary: Temperatures, fans and voltages
      x-cockpit-scope: metrics:read
      responses:
        "200":
          description: OK
          headers:
            X-Request-ID: { $ref: "#/components/headers/RequestID" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SensorsResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "500": { $ref: "#/components/responses/InternalError" }
  /api/v1/health:
    get:
      operationId: getHealth
      tags: [health]
      summary: Health checks and active findings
      x-cockpit-scope: metrics:read
      responses:
        "200":
          description: OK
          headers:
            X-Request-ID: { $ref: "#/components/headers/RequestID" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HealthResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "500": { $ref: "#/components/responses/InternalError" }
  /api/v1/events:
    get:
      operationId: listEvents
      tags: [health]
      summary: Recent events, newest first
      description: Events newest first, persisted for 30 days (at most 100,000). Use `next_cursor` to page through older events.
      x-cockpit-scope: metrics:read
      parameters:
        - { $ref: "#/components/parameters/Limit" }
        - { $ref: "#/components/parameters/Cursor" }
        - name: severity
          in: query
          required: false
          description: Minimum severity.
          schema: { type: string, enum: [info, warning, critical] }
        - name: since
          in: query
          required: false
          description: Only events at or after this time (RFC 3339).
          schema: { type: string, format: date-time }
        - name: until
          in: query
          required: false
          description: Only events before this time (RFC 3339).
          schema: { type: string, format: date-time }
        - name: type
          in: query
          required: false
          schema: { type: string, enum: [finding.raised, finding.resolved, collector.degraded, collector.recovered, key.created, key.rotated, key.revoked, settings.changed] }
      responses:
        "200":
          description: OK
          headers:
            X-Request-ID: { $ref: "#/components/headers/RequestID" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EventsResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "500": { $ref: "#/components/responses/InternalError" }
  /api/v1/events/stream:
    get:
      operationId: streamEvents
      tags: [health]
      summary: Live events (Server-Sent Events)
      description: |
        Streams new events as Server-Sent Events (D17):

        - `event: event` with an `id` and `data` holding an Event object.
        - `event: lagged` with `data: {"dropped": N}` when the client read
          too slowly and N events were dropped.
        - `event: closed` with a reason when the server ends the stream
          (e.g. the key was revoked).
        - A `: heartbeat` comment every 15 seconds.

        At most 4 streams per key and 64 in total. The key is re-checked at
        every heartbeat. `Last-Event-ID` is not supported; resume with
        `GET /events?since=`.
      x-cockpit-scope: metrics:read
      parameters:
        - name: severity
          in: query
          required: false
          description: Minimum severity.
          schema: { type: string, enum: [info, warning, critical] }
      responses:
        "200":
          description: An open event stream.
          headers:
            X-Request-ID: { $ref: "#/components/headers/RequestID" }
          content:
            text/event-stream:
              schema: { type: string }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "500": { $ref: "#/components/responses/InternalError" }
  /api/v1/processes:
    get:
      operationId: listProcesses
      tags: [machine]
      summary: Processes and their resource use
      description: |
        Sampled on demand (cached for 2 seconds). CPU percent is of one core
        over `window_seconds`, like top; it is null for processes that
        started after the previous sample. Command lines are never returned
        (D9). Cursors are bound to one listing and one set of query options.
      x-cockpit-scope: processes:read
      parameters:
        - name: sort
          in: query
          required: false
          schema: { type: string, enum: [cpu, memory, pid, name], default: cpu }
        - name: order
          in: query
          required: false
          description: Default desc for cpu and memory, asc for pid and name.
          schema: { type: string, enum: [asc, desc] }
        - name: search
          in: query
          required: false
          description: Case-insensitive substring of the process or user name.
          schema: { type: string, maxLength: 64 }
        - name: kernel_threads
          in: query
          required: false
          schema: { type: boolean, default: false }
        - { $ref: "#/components/parameters/Limit" }
        - name: cursor
          in: query
          required: false
          description: Opaque cursor from a previous page's `next_cursor`.
          schema: { type: string, maxLength: 256 }
      responses:
        "200":
          description: OK
          headers:
            X-Request-ID: { $ref: "#/components/headers/RequestID" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProcessesResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "500": { $ref: "#/components/responses/InternalError" }
  /api/v1/containers:
    get:
      operationId: listContainers
      tags: [machine]
      summary: Containers and their resource use
      description: >-
        Docker, Podman (rootful and rootless), containerd and CRI-O containers
        found in the cgroup v2 hierarchy, busiest first, at most 500 (D24).
        CPU percent is of one core. Names and images are not reported:
        they come from the container engine's API socket, which Cockpit
        does not use. Unsupported on cgroup v1 hosts.
      x-cockpit-scope: processes:read
      responses:
        "200":
          description: OK
          headers:
            X-Request-ID: { $ref: "#/components/headers/RequestID" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ContainersResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "500": { $ref: "#/components/responses/InternalError" }
  /api/v1/keys:
    get:
      operationId: listKeys
      tags: [keys]
      summary: List API keys (metadata only)
      description: Never returns a key or its hash. Unix socket only.
      x-cockpit-scope: admin
      x-cockpit-socket-only: true
      responses:
        "200":
          description: OK
          headers:
            X-Request-ID: { $ref: "#/components/headers/RequestID" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/APIKeyList" }
        "500": { $ref: "#/components/responses/InternalError" }
    post:
      operationId: createKey
      tags: [keys]
      summary: Create an API key
      description: The response contains the full key exactly once. It cannot be retrieved again. Unix socket only.
      x-cockpit-scope: admin
      x-cockpit-socket-only: true
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateAPIKeyRequest" }
            example: { name: grafana-bridge, scopes: [metrics:read] }
      responses:
        "201":
          description: Created. Store the key now; it is shown only once.
          headers:
            X-Request-ID: { $ref: "#/components/headers/RequestID" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CreatedAPIKey" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "413": { $ref: "#/components/responses/TooLarge" }
        "500": { $ref: "#/components/responses/InternalError" }
  /api/v1/keys/{id}:
    parameters:
      - { $ref: "#/components/parameters/KeyID" }
    delete:
      operationId: revokeKey
      tags: [keys]
      summary: Revoke an API key
      description: Takes effect on the next request. Revoking a revoked key succeeds. Unix socket only.
      x-cockpit-scope: admin
      x-cockpit-socket-only: true
      responses:
        "200":
          description: Revoked.
          headers:
            X-Request-ID: { $ref: "#/components/headers/RequestID" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/APIKeyResponse" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/InternalError" }
  /api/v1/keys/{id}/rotate:
    parameters:
      - { $ref: "#/components/parameters/KeyID" }
    post:
      operationId: rotateKey
      tags: [keys]
      summary: Rotate an API key
      description: Issues a replacement key with the same name, scopes and expiry, and revokes the old key immediately. The new key is shown exactly once. Unix socket only.
      x-cockpit-scope: admin
      x-cockpit-socket-only: true
      responses:
        "201":
          description: Rotated. Store the new key now; it is shown only once.
          headers:
            X-Request-ID: { $ref: "#/components/headers/RequestID" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CreatedAPIKey" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/InternalError" }
  /api/v1/settings:
    get:
      operationId: getSettings
      tags: [keys]
      summary: Effective health thresholds
      description: Unix socket only (D19).
      x-cockpit-scope: admin
      x-cockpit-socket-only: true
      responses:
        "200":
          description: OK
          headers:
            X-Request-ID: { $ref: "#/components/headers/RequestID" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SettingsResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "500": { $ref: "#/components/responses/InternalError" }
    put:
      operationId: updateSettings
      tags: [keys]
      summary: Replace health thresholds
      description: Validated like the configuration file, stored, applied immediately and recorded as a settings.changed event. Unix socket only (D19).
      x-cockpit-scope: admin
      x-cockpit-socket-only: true
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateSettingsRequest" }
      responses:
        "200":
          description: Applied.
          headers:
            X-Request-ID: { $ref: "#/components/headers/RequestID" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SettingsResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "413": { $ref: "#/components/responses/TooLarge" }
        "500": { $ref: "#/components/responses/InternalError" }
    delete:
      operationId: resetSettings
      tags: [keys]
      summary: Return to the configuration file's thresholds
      description: Unix socket only (D19).
      x-cockpit-scope: admin
      x-cockpit-socket-only: true
      responses:
        "200":
          description: Reset.
          headers:
            X-Request-ID: { $ref: "#/components/headers/RequestID" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SettingsResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "500": { $ref: "#/components/responses/InternalError" }
components:
  securitySchemes:
    apiKey:
      type: http
      scheme: bearer
      description: A Cockpit API key (`ckp_<id>_<secret>`). Never send keys in URLs.
  headers:
    RequestID:
      description: Unique ID for this request; also present in error bodies and agent logs.
      required: true
      schema: { type: string, pattern: "^req_[0-9A-HJKMNP-TV-Z]{26}$" }
  parameters:
    Limit:
      name: limit
      in: query
      required: false
      description: Page size.
      schema: { type: integer, minimum: 1, maximum: 500, default: 50 }
    Cursor:
      name: cursor
      in: query
      required: false
      description: Opaque cursor from a previous page's `next_cursor`.
      schema: { type: string, maxLength: 64 }
    KeyID:
      name: id
      in: path
      required: true
      description: The key's non-secret ID.
      schema: { type: string, pattern: "^[a-z2-7]{12}$" }
  responses:
    BadRequest:
      description: The request is invalid (unknown or malformed parameter, invalid body, or a non-loopback Host header on a loopback listener).
      headers:
        X-Request-ID: { $ref: "#/components/headers/RequestID" }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorEnvelope" }
    Unauthorized:
      description: The API key is missing or invalid. Missing, malformed, unknown, revoked and expired keys are indistinguishable.
      headers:
        X-Request-ID: { $ref: "#/components/headers/RequestID" }
        WWW-Authenticate:
          required: true
          schema: { type: string }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorEnvelope" }
    Forbidden:
      description: The API key lacks the required scope.
      headers:
        X-Request-ID: { $ref: "#/components/headers/RequestID" }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorEnvelope" }
    NotFound:
      description: No such resource.
      headers:
        X-Request-ID: { $ref: "#/components/headers/RequestID" }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorEnvelope" }
    TooLarge:
      description: The request body exceeds 64 KiB.
      headers:
        X-Request-ID: { $ref: "#/components/headers/RequestID" }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorEnvelope" }
    RateLimited:
      description: Too many requests. Retry after the number of seconds in Retry-After.
      headers:
        X-Request-ID: { $ref: "#/components/headers/RequestID" }
        Retry-After:
          required: true
          schema: { type: string, pattern: "^[0-9]+$" }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorEnvelope" }
    InternalError:
      description: An unexpected error occurred. Details are logged by the agent, never returned.
      headers:
        X-Request-ID: { $ref: "#/components/headers/RequestID" }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorEnvelope" }
  schemas:
    SchemaVersion:
      type: string
      const: "1"
    MachineID:
      description: Random identifier created by the agent; not derived from host identifiers.
      type: string
      pattern: "^[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$"
    Timestamp:
      type: string
      format: date-time
    Availability:
      type: string
      enum: [available, unsupported, permission_denied, temporarily_unavailable, not_configured]
    Redacted:
      type: array
      description: Names of sensitive fields that exist but were withheld (D9).
      items: { type: string }
    Livez:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status: { type: string, const: ok }
    Status:
      type: object
      additionalProperties: false
      required: [schema_version, machine_id, generated_at, agent, collectors]
      properties:
        schema_version: { $ref: "#/components/schemas/SchemaVersion" }
        machine_id: { $ref: "#/components/schemas/MachineID" }
        generated_at: { $ref: "#/components/schemas/Timestamp" }
        agent: { $ref: "#/components/schemas/Agent" }
        collectors:
          type: array
          items: { $ref: "#/components/schemas/Collector" }
        api: { $ref: "#/components/schemas/APIServerStatus" }
    Agent:
      type: object
      additionalProperties: false
      required: [version, api_version, started_at, uptime_seconds]
      properties:
        version: { type: string }
        api_version: { type: string, const: v1 }
        started_at: { $ref: "#/components/schemas/Timestamp" }
        uptime_seconds: { type: number, minimum: 0 }
    Collector:
      type: object
      additionalProperties: false
      required: [id, version, capabilities, external]
      properties:
        id: { type: string, pattern: "^[a-z][a-z0-9]*(\\.[a-z][a-z0-9_]*)+$" }
        version: { type: string }
        capabilities:
          type: array
          items: { $ref: "#/components/schemas/Capability" }
        external: { type: boolean, description: True for an extension collector built with the public collector SDK (D23). }
        sdk_version: { type: integer, minimum: 1, description: Collector SDK major version an extension collector targets. }
    Capability:
      type: object
      additionalProperties: false
      required: [name, status]
      properties:
        name: { type: string, examples: [cpu.usage] }
        status: { $ref: "#/components/schemas/Availability" }
        reason:
          type: string
          description: Safe, human-readable explanation; present when status is not available.
    APIServerStatus:
      type: object
      additionalProperties: false
      description: Admin principal only.
      required: [listeners, requests, active_clients, open_streams]
      properties:
        listeners:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [transport, address, tls]
            properties:
              transport: { type: string, enum: [unix, tcp] }
              address: { type: string }
              tls: { type: boolean }
        requests:
          type: object
          additionalProperties: false
          required: [total, status_2xx, status_4xx, status_5xx, auth_failures, rate_limited]
          properties:
            total: { type: integer, minimum: 0 }
            status_2xx: { type: integer, minimum: 0 }
            status_4xx: { type: integer, minimum: 0 }
            status_5xx: { type: integer, minimum: 0 }
            auth_failures: { type: integer, minimum: 0 }
            rate_limited: { type: integer, minimum: 0 }
        active_clients:
          type: integer
          minimum: 0
          description: Distinct API keys used in the last 5 minutes.
        open_streams:
          type: integer
          minimum: 0
          description: Open event streams.
    SystemResponse:
      type: object
      additionalProperties: false
      description: GET /system.
      required: [schema_version, machine_id, generated_at, system]
      properties:
        schema_version: { $ref: "#/components/schemas/SchemaVersion" }
        machine_id: { $ref: "#/components/schemas/MachineID" }
        generated_at: { $ref: "#/components/schemas/Timestamp" }
        system: { $ref: "#/components/schemas/SystemSection" }
    SystemSection:
      type: object
      additionalProperties: false
      description: Data with its availability (see docs/API.md §5).
      required: [status, collected_at, stale, source, data]
      properties:
        status: { $ref: "#/components/schemas/Availability" }
        collected_at: { type: [string, "null"], format: date-time }
        stale: { type: boolean, description: True when the data is older than twice the collection interval. }
        source: { type: string, description: "Where the data comes from, e.g. procfs." }
        reason: { type: string, description: Safe explanation when status is not available. }
        data:
          anyOf:
            - $ref: "#/components/schemas/System"
            - type: "null"
    System:
      type: object
      additionalProperties: false
      required: [hostname, os, kernel, architecture, boot_time, uptime_seconds]
      properties:
        hostname: { type: string }
        os:
          type: object
          additionalProperties: false
          required: [id, name, version, pretty_name]
          properties:
            id: { type: string, examples: [ubuntu] }
            name: { type: string }
            version: { type: string }
            pretty_name: { type: string }
        kernel: { type: string }
        architecture: { type: string, examples: [amd64, arm64] }
        boot_time: { type: [string, "null"], format: date-time }
        uptime_seconds: { type: [number, "null"], minimum: 0 }
    HardwareResponse:
      type: object
      additionalProperties: false
      description: GET /hardware. Each section reports its own availability and source.
      required: [schema_version, machine_id, generated_at, cpu, memory, memory_modules, board, block_devices, network_interfaces, pci_devices, usb_devices, gpus]
      properties:
        schema_version: { $ref: "#/components/schemas/SchemaVersion" }
        machine_id: { $ref: "#/components/schemas/MachineID" }
        generated_at: { $ref: "#/components/schemas/Timestamp" }
        cpu: { $ref: "#/components/schemas/CPUInventorySection" }
        memory: { $ref: "#/components/schemas/MemoryInventorySection" }
        memory_modules: { $ref: "#/components/schemas/MemoryModulesSection" }
        board: { $ref: "#/components/schemas/BoardSection" }
        block_devices: { $ref: "#/components/schemas/BlockDevicesSection" }
        network_interfaces: { $ref: "#/components/schemas/NetworkInterfaceInventorySection" }
        pci_devices: { $ref: "#/components/schemas/PCIDevicesSection" }
        usb_devices: { $ref: "#/components/schemas/USBDevicesSection" }
        gpus: { $ref: "#/components/schemas/GPUsSection" }
    CPUInventorySection:
      type: object
      additionalProperties: false
      description: Data with its availability (see docs/API.md §5).
      required: [status, collected_at, stale, source, data]
      properties:
        status: { $ref: "#/components/schemas/Availability" }
        collected_at: { type: [string, "null"], format: date-time }
        stale: { type: boolean, description: True when the data is older than twice the collection interval. }
        source: { type: string, description: "Where the data comes from, e.g. procfs." }
        reason: { type: string, description: Safe explanation when status is not available. }
        data:
          anyOf:
            - $ref: "#/components/schemas/CPUInventory"
