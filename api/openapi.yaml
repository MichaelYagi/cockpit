      properties:
        schema_version: { $ref: "#/components/schemas/SchemaVersion" }
        machine_id: { $ref: "#/components/schemas/MachineID" }
        generated_at: { $ref: "#/components/schemas/Timestamp" }
        block_devices: { $ref: "#/components/schemas/BlockDevicesSection" }
        filesystems: { $ref: "#/components/schemas/FilesystemsSection" }
        disk_health: { $ref: "#/components/schemas/DiskHealthSection" }
        zfs: { $ref: "#/components/schemas/ZFSSection" }
    ZFSSection:
      type: object
      additionalProperties: false
      description: Data with its availability (see docs/API.md §5).
      required: [status, collected_at, stale, source, data]
      properties:
        status: { $ref: "#/components/schemas/Availability" }
        collected_at: { type: [string, "null"], format: date-time }
        stale: { type: boolean }
        source: { type: string }
        reason: { type: string }
        data:
          anyOf:
            - { $ref: "#/components/schemas/ZFS" }
            - type: "null"
    ZFS:
      type: object
      additionalProperties: false
      description: ZFS pools and the ARC (D25).
      required: [pools, arc]
      properties:
        pools:
          type: array
          items: { $ref: "#/components/schemas/ZFSPool" }
        arc:
          anyOf:
            - type: object
              additionalProperties: false
              required: [size_bytes, target_bytes, max_bytes, hits, misses, hit_percent]
              properties:
                size_bytes: { type: integer, minimum: 0 }
                target_bytes: { type: integer, minimum: 0 }
                max_bytes: { type: integer, minimum: 0 }
                hits: { type: integer, minimum: 0, description: Since the module loaded. }
                misses: { type: integer, minimum: 0 }
                hit_percent: { type: [number, "null"] }
            - type: "null"
        detail_reason: { type: string, description: Why capacity or error counts are missing. }
    ZFSPool:
      type: object
      additionalProperties: false
      required: [name, state, size_bytes, allocated_bytes, free_bytes, read_errors, write_errors, checksum_errors]
      properties:
        name: { type: string }
        state: { type: string, examples: [ONLINE, DEGRADED, FAULTED] }
        size_bytes: { type: [integer, "null"] }
        allocated_bytes: { type: [integer, "null"] }
        free_bytes: { type: [integer, "null"] }
        read_errors: { type: [integer, "null"] }
        write_errors: { type: [integer, "null"] }
        checksum_errors: { type: [integer, "null"] }
