        reason: { type: string }
        data:
          anyOf:
            - type: array
              items: { $ref: "#/components/schemas/USBDevice" }
            - type: "null"
    GPUsSection:
      type: object
      additionalProperties: false
      description: Data with its availability (see docs/API.md §5).
      required: [status, collected_at, stale, source, data]
      properties:
        status: { $ref: "#/components/schemas/Availability" }
        collected_at: { type: [string, "null"], format: date-time }
        stale: { type: boolean }
        source: { type: string }
        reason: { type: string }
        data:
          anyOf:
            - type: array
              items: { $ref: "#/components/schemas/GPU" }
            - type: "null"
    CPUInventory:
      type: object
      additionalProperties: false
      required: [model_name, logical_cores, vendor, family, model, stepping, sockets, cores, caches, max_frequency_mhz, virtualization, hypervisor, flags]
      properties:
        model_name: { type: string }
        logical_cores: { type: integer, minimum: 0 }
        vendor: { type: string, examples: [GenuineIntel, AuthenticAMD, ARM] }
        family: { type: string }
        model: { type: string }
        stepping: { type: string }
        sockets: { type: integer, minimum: 0 }
        cores: { type: integer, minimum: 0, description: Physical cores across all sockets. }
        caches:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [level, type, size_bytes, shared_by]
            properties:
              level: { type: integer, minimum: 1 }
              type: { type: string, examples: [Data, Instruction, Unified] }
              size_bytes: { type: integer, minimum: 0 }
              shared_by: { type: integer, minimum: 0, description: Logical CPUs sharing one instance of this cache. }
        max_frequency_mhz: { type: [number, "null"], minimum: 0 }
        virtualization: { type: string, enum: ["", VT-x, AMD-V] }
        hypervisor: { type: boolean, description: Running under a hypervisor. }
        flags: { type: array, items: { type: string }, description: Notable feature flags only. }
    MemoryModule:
      type: object
      additionalProperties: false
      required: [locator, size_bytes, type, speed_mts, manufacturer, part_number]
      properties:
        locator: { type: string, examples: [DIMM_A1] }
        size_bytes: { type: integer, minimum: 0 }
        type: { type: string, examples: [DDR4, DDR5] }
        speed_mts: { type: integer, minimum: 0 }
        manufacturer: { type: string }
        part_number: { type: string }
        serial: { type: string, x-cockpit-sensitive: true }
        redacted: { $ref: "#/components/schemas/Redacted" }
    Board:
      type: object
      additionalProperties: false
      required: [system_vendor, product_name, board_vendor, board_name, bios_vendor, bios_version, bios_date, chassis_type]
      properties:
        system_vendor: { type: string }
        product_name: { type: string }
        board_vendor: { type: string }
        board_name: { type: string }
        bios_vendor: { type: string }
        bios_version: { type: string }
        bios_date: { type: string }
        chassis_type: { type: string, examples: [Desktop, Laptop, Rack mount chassis] }
        serial: { type: string, x-cockpit-sensitive: true }
        redacted: { $ref: "#/components/schemas/Redacted" }
    PCIDevice:
      type: object
      additionalProperties: false
      required: [address, class_code, class_name, vendor_id, device_id, vendor_name, device_name, driver]
      properties:
        address: { type: string, examples: ["0000:01:00.0"] }
        class_code: { type: string, examples: ["0x030000"] }
        class_name: { type: string }
        vendor_id: { type: string }
        device_id: { type: string }
        vendor_name: { type: string, description: From pci.ids when installed; empty otherwise. }
        device_name: { type: string }
        driver: { type: string }
    USBDevice:
      type: object
      additionalProperties: false
      required: [path, vendor_id, product_id, manufacturer, product, speed_mbps]
      properties:
        path: { type: string, examples: ["1-2.4"] }
        vendor_id: { type: string }
        product_id: { type: string }
        manufacturer: { type: string }
        product: { type: string }
        speed_mbps: { type: [number, "null"], minimum: 0 }
        serial: { type: string, x-cockpit-sensitive: true }
        redacted: { $ref: "#/components/schemas/Redacted" }
    GPU:
      type: object
      additionalProperties: false
      required: [vendor, name, pci_address, driver, driver_version, memory_total_bytes, memory_used_bytes, utilization_percent, temperature_celsius, power_watts, power_limit_watts, fan_percent, frequency_mhz, max_frequency_mhz, metrics_source]
      properties:
        vendor: { type: string, examples: [NVIDIA, AMD, Intel] }
        name: { type: string }
        pci_address: { type: string }
        driver: { type: string }
        driver_version: { type: string }
        memory_total_bytes: { type: [integer, "null"], minimum: 0 }
        memory_used_bytes: { type: [integer, "null"], minimum: 0 }
        utilization_percent: { type: [number, "null"], minimum: 0, maximum: 100 }
        temperature_celsius: { type: [number, "null"] }
        power_watts: { type: [number, "null"], minimum: 0 }
        power_limit_watts: { type: [number, "null"], minimum: 0 }
        fan_percent: { type: [number, "null"], minimum: 0 }
        frequency_mhz: { type: [number, "null"], minimum: 0, description: Current GPU clock (Intel i915/xe). }
        max_frequency_mhz: { type: [number, "null"], minimum: 0 }
        metrics_source: { type: string, enum: ["", nvidia-smi, amdgpu, i915, xe] }
        uuid: { type: string, x-cockpit-sensitive: true }
        redacted: { $ref: "#/components/schemas/Redacted" }
    MemoryInventory:
      type: object
      additionalProperties: false
      required: [total_bytes, swap_total_bytes]
      properties:
        total_bytes: { type: integer, minimum: 0 }
        swap_total_bytes: { type: integer, minimum: 0 }
    BlockDevice:
      type: object
      additionalProperties: false
      required: [name, model, transport, rotational, removable, size_bytes]
      properties:
        name: { type: string, examples: [nvme0n1] }
        model: { type: string }
        transport: { type: string, enum: [nvme, sata, usb, virtio, xen, mmc, scsi, unknown] }
        rotational: { type: [boolean, "null"] }
        removable: { type: boolean }
        size_bytes: { type: integer, minimum: 0 }
        serial: { type: string, x-cockpit-sensitive: true }
        wwn: { type: string, x-cockpit-sensitive: true }
        redacted: { $ref: "#/components/schemas/Redacted" }
    NetworkInterfaceInventory:
      type: object
      additionalProperties: false
      required: [name, mtu, loopback, speed_mbps]
      properties:
        name: { type: string }
        mtu: { type: integer, minimum: 0 }
        loopback: { type: boolean }
        speed_mbps: { type: [integer, "null"], minimum: 0 }
        mac_address: { type: string, x-cockpit-sensitive: true }
        redacted: { $ref: "#/components/schemas/Redacted" }
    MetricsResponse:
      type: object
      additionalProperties: false
      description: GET /metrics. Sections not selected with `sections` are omitted.
      required: [schema_version, machine_id, generated_at]
      properties:
        schema_version: { $ref: "#/components/schemas/SchemaVersion" }
        machine_id: { $ref: "#/components/schemas/MachineID" }
        generated_at: { $ref: "#/components/schemas/Timestamp" }
        cpu: { $ref: "#/components/schemas/CPUMetricsSection" }
        memory: { $ref: "#/components/schemas/MemoryMetricsSection" }
        memory_pressure: { $ref: "#/components/schemas/MemoryPressureSection" }
        filesystems: { $ref: "#/components/schemas/FilesystemsSection" }
        network: { $ref: "#/components/schemas/NetworkInterfacesSection" }
        sensors: { $ref: "#/components/schemas/SensorsSection" }
        gpu: { $ref: "#/components/schemas/GPUsSection" }
        custom:
          type: array
          description: Generic metrics from extension collectors (D22), one entry per collector. Empty when no extension collectors are built in.
          items: { $ref: "#/components/schemas/CustomMetricsSet" }
        power: { $ref: "#/components/schemas/PowerSection" }
        ups: { $ref: "#/components/schemas/UPSSection" }
    PowerSection:
      type: object
      additionalProperties: false
      description: Data with its availability (see docs/API.md §5).
      required: [status, collected_at, stale, source, data]
      properties:
        status: { $ref: "#/components/schemas/Availability" }
        collected_at: { type: [string, "null"], format: date-time }
        stale: { type: boolean }
        source: { type: string }
        reason: { type: string }
        data:
          anyOf:
            - type: array
              items: { $ref: "#/components/schemas/PowerSupply" }
            - type: "null"
    UPSSection:
      type: object
      additionalProperties: false
      description: Data with its availability (see docs/API.md §5).
      required: [status, collected_at, stale, source, data]
      properties:
        status: { $ref: "#/components/schemas/Availability" }
        collected_at: { type: [string, "null"], format: date-time }
        stale: { type: boolean }
        source: { type: string }
        reason: { type: string }
        data:
          anyOf:
            - type: array
              items: { $ref: "#/components/schemas/UPS" }
            - type: "null"
    PowerSupply:
      type: object
      additionalProperties: false
      description: A battery, mains adapter or USB supply from sysfs (D25).
      required: [name, type, online, capacity_percent, power_watts, energy_now_wh, energy_full_wh, hours_remaining]
      properties:
        name: { type: string }
        type: { type: string, examples: [battery, mains, usb] }
        online: { type: [boolean, "null"] }
        status: { type: string, examples: [charging, discharging, full, not_charging] }
        capacity_percent: { type: [number, "null"] }
        health: { type: string }
        power_watts: { type: [number, "null"] }
        energy_now_wh: { type: [number, "null"] }
        energy_full_wh: { type: [number, "null"] }
        hours_remaining: { type: [number, "null"], description: While discharging with a known power draw. }
        model: { type: string }
    UPS:
      type: object
      additionalProperties: false
      description: A UPS read from a Network UPS Tools server (D25). Serial numbers are never read.
      required: [name, status, on_battery, low_battery, charge_percent, runtime_seconds, load_percent, input_volts, output_volts]
      properties:
        name: { type: string }
        description: { type: string }
        status:
          type: array
          description: NUT status flags, e.g. OL (on line), OB (on battery), LB (low battery), CHRG.
          items: { type: string }
        on_battery: { type: boolean }
        low_battery: { type: boolean }
        charge_percent: { type: [number, "null"] }
        runtime_seconds: { type: [number, "null"] }
        load_percent: { type: [number, "null"] }
        input_volts: { type: [number, "null"] }
        output_volts: { type: [number, "null"] }
        model: { type: string }
    CustomMetricsSet:
      type: object
      additionalProperties: false
      description: One collector's generic metrics with its availability (see docs/API.md §5).
      required: [collector, status, collected_at, stale, source, data, dropped_series]
      properties:
        collector: { type: string, pattern: "^[a-z][a-z0-9]*(\\.[a-z][a-z0-9_]*)+$" }
        status: { $ref: "#/components/schemas/Availability" }
        collected_at: { type: [string, "null"], format: date-time }
        stale: { type: boolean, description: True when the data is older than twice the collection interval. }
        source: { type: string }
        reason: { type: string }
        dropped_series: { type: integer, minimum: 0, description: "Metrics rejected in the last collection: invalid, duplicated, or over the 500-series limit." }
        problem: { type: string, description: "The first rejection reason, when any metric was dropped." }
        data:
          anyOf:
            - type: array
              maxItems: 500
              items: { $ref: "#/components/schemas/CustomMetric" }
            - type: "null"
    CustomMetric:
      type: object
      additionalProperties: false
      required: [name, kind, unit, labels, value, rate_per_second]
      properties:
        name: { type: string, maxLength: 128, pattern: "^[a-z][a-z0-9_]*(\\.[a-z0-9_]+)+$" }
        kind: { type: string, enum: [gauge, counter] }
        unit:
          type: string
          enum: [bytes, bytes_per_second, percent, ratio, celsius, watts, volts, hertz, rpm, seconds, count, per_second]
        labels:
          type: object
          maxProperties: 8
          additionalProperties: { type: string, maxLength: 128 }
        value: { type: number, description: The gauge reading or the counter total. }
        rate_per_second: { type: [number, "null"], description: "Counters only, from the second sample on; in rate_unit." }
        rate_unit: { type: string, enum: [bytes_per_second, per_second, seconds_per_second] }
    CPUMetricsSection:
      type: object
      additionalProperties: false
      description: Data with its availability (see docs/API.md §5).
