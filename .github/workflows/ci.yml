name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: 24 # runs the TypeScript client example directly
      - name: gofmt
        run: make fmt-check
      - name: go vet
        run: make vet
      - name: staticcheck
        run: make lint
      - name: test (race detector)
        run: make test-race
      - name: test (integration, non-root)
        run: make test-integration
      - name: example extension build
        run: make examples
      - name: govulncheck
        run: make vuln
      - name: build
        run: make build

  cross:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: cross-compile and vet (linux, darwin, windows)
        run: make cross

  # Collectors for macOS and Windows can only be exercised on those
  # systems: the conformance suite runs against the real collectors there.
  platforms:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: build
        run: go build ./...
      - name: vet
        run: go vet ./...
      - name: platform tests and conformance
        run: go test ./internal/collector/... ./internal/platform/... ./internal/tlsutil/... ./pkg/...
